[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "crossimpactbalances"
version = "0.2.0"
description = "Python interface to CrossImpactBalances.jl — fast Cross-Impact Balance scenario analysis, backed by the Julia engine via juliacall."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Iain Morrow" }]
keywords = ["cross-impact-balance", "cib", "scenario-analysis", "foresight", "juliacall"]
dependencies = [
    "juliacall>=0.9.20",
]

[project.optional-dependencies]
pandas = ["pandas>=1.3"]
test = ["pytest>=7"]

[project.urls]
Homepage = "https://github.com/IainDM/CrossImpactBalances"
Source = "https://github.com/IainDM/CrossImpactBalances"

[tool.hatch.build.targets.wheel]
packages = ["crossimpactbalances"]
# Include a compiled native library if one has been staged under _libcib/
# (see docs). These files are gitignored build artifacts, so list them as
# artifacts to override the VCS-ignore exclusion when present.
artifacts = ["crossimpactbalances/_libcib/**"]

# juliapkg.json (the Julia dependency spec juliacall reads) lives inside the
# package directory and is tracked in git, so the `packages` entry above already
# ships it in the wheel. Do NOT add a force-include for it: that materialises a
# second physical copy into site-packages, and for an editable install juliapkg
# then finds both that copy and the one in the source tree. Its "path": "../.."
# resolves to a different directory from each, and juliapkg aborts with
# "'path' entries are not unique".

[tool.pytest.ini_options]
testpaths = ["tests"]
