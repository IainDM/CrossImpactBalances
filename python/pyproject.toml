[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "crossimpactbalances"
version = "0.2.0"
description = "Python interface to CrossImpactBalances.jl — fast Cross-Impact Balance scenario analysis, backed by the Julia engine via juliacall."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Iain Morrow" }]
keywords = ["cross-impact-balance", "cib", "scenario-analysis", "foresight", "juliacall"]
dependencies = [
    "juliacall>=0.9.20",
]

[project.optional-dependencies]
pandas = ["pandas>=1.3"]
test = ["pytest>=7"]

[project.urls]
Homepage = "https://github.com/IainDM/CrossImpactBalances"
Source = "https://github.com/IainDM/CrossImpactBalances"

[tool.hatch.build.targets.wheel]
packages = ["crossimpactbalances"]

# Ship the juliapkg dependency spec inside the package so juliacall can find it.
[tool.hatch.build.targets.wheel.force-include]
"crossimpactbalances/juliapkg.json" = "crossimpactbalances/juliapkg.json"

[tool.pytest.ini_options]
testpaths = ["tests"]
